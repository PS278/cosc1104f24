<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid d-flex justify-content-center">
            <a class="navbar-brand text-center" href="#">AWS KMS Manager</a>
        </div>
    </nav>
    

    <!-- Main Content -->
    <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
            <h2 class="text-center text-primary mb-4">Login to AWS KMS</h2>
            <form action="/login" method="POST">
                <!-- Access Key -->
                <div class="mb-3">
                    <label for="access_key" class="form-label">Access Key</label>
                    <input type="text" class="form-control" id="access_key" name="access_key" placeholder="Enter Access Key" required>
                </div>
                <!-- Secret Key -->
                <div class="mb-3">
                    <label for="secret_key" class="form-label">Secret Key</label>
                    <input type="password" class="form-control" id="secret_key" name="secret_key" placeholder="Enter Secret Key" required>
                </div>
                <!-- Region -->
                <div class="mb-3">
                    <label for="region" class="form-label">Region</label>
                    <input type="text" class="form-control" id="region" name="region" placeholder="e.g., us-east-1" required>
                </div>
                <!-- Submit Button -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-light text-center text-lg-start mt-4">
        <div class="text-center p-3 bg-primary text-white">
            © 2024 AWS KMS Manager
        </div>
    </footer>
</body>
</html>
